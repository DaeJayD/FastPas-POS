name: vasenizzpos
description: FastPas POS, formerly VaseNizz, a mobile retail point-of-sale app in development.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.4'

dependencies:
  http: ^1.6.0
  intl: ^0.20.2
  syncfusion_flutter_datepicker: ^31.2.10
  pdf: ^3.10.4
  printing: ^5.11.1
  path_provider: ^2.1.1
  open_file: ^3.3.3
  flutter:
    sdk: flutter
  # Icon font for Flutter's adaptive controls.
  cupertino_icons: ^1.0.8
  table_calendar: ^3.0.9
  fl_chart: ^0.68.0
  supabase_flutter: ^2.1.2
  image_picker: ^1.0.4
  geolocator: ^11.0.1
  permission_handler: ^11.0.1
  sqflite: ^2.4.4+2
  path: ^1.9.1
  shared_preferences: ^2.5.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"
  sqflite_common_ffi: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/fastpas_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#202528"
  image_path: "assets/fastpas_icon.png"
  adaptive_icon_background: "#FFFFFF"


flutter:
  uses-material-design: true

  assets:
    - assets/fastpas_icon.png
